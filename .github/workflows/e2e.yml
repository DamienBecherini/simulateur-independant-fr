name: Tests de bout en bout

# Plus lents que les tests unitaires : lancés sur integration, la branche de recette, puis sur main et à la demande,
# pas à chaque push de branche. La règle de protection de main exige qu’ils aient réussi sur le commit avant qu’il y arrive.
on:
  workflow_dispatch:
  push:
    branches: [main, integration]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright (application Electron)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Installer Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci --ignore-scripts

      # Les scripts d'installation des paquets ne sont pas lancés : on télécharge explicitement le seul binaire utile.
      - name: Installer Electron
        run: node node_modules/electron/install.js

      # Electron a besoin d'un affichage : xvfb-run fournit un serveur X virtuel.
      - name: Compiler l'application et lancer les tests de bout en bout
        run: xvfb-run --auto-servernum npm run test:e2e

      - name: Publier le rapport
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rapport-e2e
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
