name: Tests de bout en bout

# Application de bureau et démo web. Plus lents que les tests unitaires : lancés sur integration, la branche de recette, puis sur main et à la demande,
# pas à chaque push de branche. La règle de protection de main exige qu’ils aient réussi sur le commit avant qu’il y arrive.
on:
  workflow_dispatch:
  push:
    branches: [main, integration]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright (application Electron)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci --ignore-scripts

      # Les scripts d'installation des paquets ne sont pas lancés : on télécharge explicitement le seul binaire utile.
      - name: Installer Electron
        run: node node_modules/electron/install.js

      # Electron a besoin d'un affichage : xvfb-run fournit un serveur X virtuel.
      - name: Compiler l'application et lancer les tests de bout en bout
        run: xvfb-run --auto-servernum npm run test:e2e

      - name: Publier le rapport
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapport-e2e
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  # La démo web a sa propre suite (e2e-web/) : largeurs de 320 à 1 440 px, tactile, clavier, polices, accessibilité.
  # Lancée aussi par « Démo web » avant chaque publication depuis main ; ici, une régression se voit dès integration.
  demo-web:
    name: Playwright (démo web)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci --ignore-scripts

      - name: Installer Chromium
        run: npm run installer:chromium -- --with-deps

      - name: Compiler la démo et la tester dans le navigateur
        run: npm run test:web

      - name: Publier le rapport
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapport-demo-web
          path: test-results/web
          if-no-files-found: ignore
          retention-days: 14

  # La recette se fait dans Firefox, dont le moteur de rendu n'est pas celui de Chromium. Seuls les tests de mise en
  # page y sont relancés (zoom, lisibilité, tableaux qui défilent, barres collées, téléphone) : la série entière y
  # prend deux fois plus de temps, pour des comportements que le moteur ne change pas.
  demo-web-firefox:
    name: Playwright (démo web, Firefox)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci --ignore-scripts

      - name: Installer Firefox
        run: npm run installer:firefox -- --with-deps

      - name: Compiler la démo et tester sa mise en page dans Firefox
        run: npm run test:web:firefox:mise-en-page

      - name: Publier le rapport
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapport-demo-web-firefox
          path: test-results/web-firefox
          if-no-files-found: ignore
          retention-days: 14
