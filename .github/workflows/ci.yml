name: CI

on:
  push:
  pull_request:

# Une nouvelle exécution sur la même branche annule la précédente.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualite:
    name: Lint, types, tests et build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Facultatif : sans ce secret, l'analyse SonarQube est sautée et remplacée par la détection de duplication.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Historique complet : SonarQube s'en sert pour attribuer les nouvelles lignes.
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      # Sans les scripts d'installation des paquets : aucune étape de ce job n'a besoin du binaire d'Electron.
      - name: Installer les dépendances
        run: npm ci --ignore-scripts

      - name: Lint (ESLint, complexité comprise)
        run: npm run lint

      - name: Vérifier les types de l'interface
        run: npm run typecheck

      - name: Vérifier les types du backend
        run: npm run transpile:electron

      - name: Vérifier les types des tests du backend
        run: npm run typecheck:tests

      - name: Tests et couverture
        run: npm run test:coverage

      - name: Build de l'interface
        run: npm run build

      # L'offre gratuite de SonarQube Cloud n'analyse que la branche principale (« Organization is not allowed to
      # access data from non main branches ») : l'analyse tourne sur main, et ailleurs la détection de duplication
      # prend le relais.
      - name: Analyse SonarQube Cloud
        if: env.SONAR_TOKEN != '' && github.ref == 'refs/heads/main'
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        # Attend le verdict de la porte qualité et fait échouer le job s'il est rouge : main passe au rouge, et la
        # démo n'est publiée qu'après un examen.
        timeout-minutes: 8
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

      - name: Détection de code dupliqué (hors analyse SonarQube)
        if: env.SONAR_TOKEN == '' || github.ref != 'refs/heads/main'
        run: npm run duplication
