name: CI

on:
  push:
  pull_request:

# Une nouvelle exécution sur la même branche annule la précédente.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualite:
    name: Lint, types, tests et build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Facultatif : sans ce secret, l'analyse SonarQube est sautée et remplacée par la détection de duplication.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          # Historique complet : SonarQube s'en sert pour attribuer les nouvelles lignes.
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Lint (ESLint, complexité comprise)
        run: npm run lint

      - name: Vérifier les types de l'interface
        run: npx tsc -b

      - name: Vérifier les types du backend
        run: npm run transpile:electron

      - name: Vérifier les types des tests du backend
        run: npm run typecheck:tests

      - name: Tests et couverture
        run: npm run test:coverage

      - name: Build de l'interface
        run: npx vite build

      - name: Analyse SonarQube Cloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5

      - name: Détection de code dupliqué (sans SonarQube)
        if: env.SONAR_TOKEN == ''
        run: npm run duplication
