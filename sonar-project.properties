# Analyse SonarQube Cloud, lancée par la CI (.github/workflows/ci.yml) quand le secret SONAR_TOKEN existe.
sonar.projectKey=DamienBecherini_simulateur-independant-fr
sonar.organization=damienbecherini
sonar.projectName=Simulateur Indépendant FR

sonar.sources=src
sonar.tests=src,e2e,e2e-web
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,e2e/**/*.ts,e2e-web/**/*.ts
sonar.exclusions=src/components/ui/**
# Le seuil de couverture de la CI (vitest.config.ts) ne porte que sur la logique : on aligne SonarQube dessus. Ne sont
# pas mesurés : l'interface, les composants, les points d'entrée du process principal et ses canaux IPC (main.ts et ce
# qui en a été découpé : fenêtres, canaux, ancien dossier de données), le point d'entrée du serveur MCP, les aides des
# tests, les racines de la démo web et son service worker. Ils sont vérifiés par les tests de bout en bout.
sonar.coverage.exclusions=src/ui/**,src/components/**,src/backend/main.ts,src/backend/fenetres.ts,src/backend/canaux-*.ts,src/backend/ancien-dossier-de-donnees.ts,src/backend/preload.cts,src/backend/pathResolver.ts,src/backend/isDev.ts,src/backend/mcp/serveur.ts,src/backend/logic/testing/**,src/web/*.tsx,src/web/pwa/service-worker.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8

# ---------------------------------------------------------------------------------------------------------------------
# Remarques acceptées (relecture 2026-10, décision 4 : on corrige ce qui est réel, on accepte les règles purement
# stylistiques et les faux positifs, avec leur raison). Sans accès à l'interface de SonarQube Cloud, elles sont écrites
# ici : une entrée par règle, limitée aux fichiers concernés. Pour en ajouter une : un identifiant de plus dans la liste
# ci-dessous, sa règle (ruleKey), ses fichiers (resourceKey, motif de chemin) et un commentaire qui dit pourquoi.
# ---------------------------------------------------------------------------------------------------------------------
sonar.issue.ignore.multicriteria=tailwind,propsLectureSeule,asyncSansAwaitDemo,asyncSansAwaitCanaux,asyncSansAwaitTests,gabaritsImbriques,ternairesImbriques,nomDuCatch,clesParIndice,rolesAria,tabIndexDefilement,clavierDuGraphique,espacesJsxInstallation,espacesJsxComparateur,methodesVidesResizeObserver,sansAssertionPoll,sansAssertionSonde,clicForceRadios,negationNaNIR,negationNaNKm,atMoteur,hasOwnMoteur,codePointEmpreinte,awaitDansBoucleRenommage,awaitDansBoucleBoite

# Faux positif : la syntaxe Tailwind CSS v4 « @custom-variant » (avec « & » et « @slot ») n'est pas comprise par
# l'analyseur CSS, qui y voit un sélecteur imbriqué sans racine (règle css:S8776). Elle est valide et compilée par Tailwind.
sonar.issue.ignore.multicriteria.tailwind.ruleKey=css:S8776
sonar.issue.ignore.multicriteria.tailwind.resourceKey=src/ui/App.css

# S6759 « props en lecture seule » : purement stylistique (G11). Les composants ne modifient jamais leurs props (React
# les gèle en développement) ; un Readonly<…> mécanique sur chaque composant n'apporterait rien.
sonar.issue.ignore.multicriteria.propsLectureSeule.ruleKey=typescript:S6759
sonar.issue.ignore.multicriteria.propsLectureSeule.resourceKey=src/**/*.tsx

# S7503 « async sans await » : le pont de la démo web implémente window.api, dont chaque méthode rend une promesse
# comme le pont d'Electron ; async garde ce contrat et change une exception en promesse rejetée.
sonar.issue.ignore.multicriteria.asyncSansAwaitDemo.ruleKey=typescript:S7503
sonar.issue.ignore.multicriteria.asyncSansAwaitDemo.resourceKey=src/web/api-navigateur.ts
# Même raison pour les canaux IPC des calculs : le calcul est synchrone, l'appel depuis l'interface est une promesse.
sonar.issue.ignore.multicriteria.asyncSansAwaitCanaux.ruleKey=typescript:S7503
sonar.issue.ignore.multicriteria.asyncSansAwaitCanaux.resourceKey=src/backend/canaux-*.ts
# Le faux window.api des tests de composants imite ce même contrat (chaque méthode résout une valeur neutre).
sonar.issue.ignore.multicriteria.asyncSansAwaitTests.ruleKey=typescript:S7503
sonar.issue.ignore.multicriteria.asyncSansAwaitTests.resourceKey=src/ui/testing/setup.ts

# S4624 « gabarits imbriqués » : stylistique. Les messages en français se construisent avec des morceaux facultatifs
# (« ${x ? ` ; créée en ${date}` : ""} ») ; les sortir dans des variables allongerait le code sans le clarifier.
sonar.issue.ignore.multicriteria.gabaritsImbriques.ruleKey=typescript:S4624
sonar.issue.ignore.multicriteria.gabaritsImbriques.resourceKey=src/**/*.ts
# S3358 « ternaires imbriqués » : stylistique. Ce sont des choix de libellé ou de classe à trois cas, sur une ligne ; la
# complexité des fonctions reste surveillée par ESLint (règle complexity).
sonar.issue.ignore.multicriteria.ternairesImbriques.ruleKey=typescript:S3358
sonar.issue.ignore.multicriteria.ternairesImbriques.resourceKey=src/**/*
# S7718 « nom du paramètre de catch » : la règle veut « error_ » ; le code est écrit en français (« erreur »), choix
# du projet.
sonar.issue.ignore.multicriteria.nomDuCatch.ruleKey=typescript:S7718
sonar.issue.ignore.multicriteria.nomDuCatch.resourceKey=src/**/*.ts

# S6479 « indice comme clé » : les listes concernées (avertissements, notes, morceaux d'un texte fixe, segments d'un
# graphique, trajets) ne sont jamais réordonnées, et leurs éléments n'ont pas d'identifiant ; les trajets sont des
# champs contrôlés sans état propre, un retrait ne mélange donc pas les saisies.
sonar.issue.ignore.multicriteria.clesParIndice.ruleKey=typescript:S6479
sonar.issue.ignore.multicriteria.clesParIndice.resourceKey=src/ui/components/**/*.tsx

# S6819 « préférer un élément natif au rôle ARIA » : role="group" avec un nom accessible regroupe des boutons (un
# fieldset apporterait sa bordure et la désactivation en bloc, non voulues) ; role="status" est la zone d'annonce
# polie (<output> est fait pour le résultat d'un formulaire) ; une case de la grille contient des blocs, qu'un
# <button> ne peut pas contenir. Vérifié par les audits d'accessibilité (axe) des tests de bout en bout.
sonar.issue.ignore.multicriteria.rolesAria.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.rolesAria.resourceKey=src/**/*.tsx
# S6845 « tabIndex sur un élément non interactif » : une zone qui défile (tableau large, bloc de code) doit pouvoir
# recevoir le focus pour défiler au clavier (WCAG 2.1.1, règle axe « scrollable-region-focusable »).
sonar.issue.ignore.multicriteria.tabIndexDefilement.ruleKey=typescript:S6845
sonar.issue.ignore.multicriteria.tabIndexDefilement.resourceKey=src/ui/components/**/*.tsx
# S6847 « écouteur clavier sur un élément non interactif » : le graphique de l'optimiseur se parcourt aux flèches,
# comme le prévoit le motif ARIA d'un graphique interactif ; il a un nom accessible et reçoit le focus.
sonar.issue.ignore.multicriteria.clavierDuGraphique.ruleKey=typescript:S6847
sonar.issue.ignore.multicriteria.clavierDuGraphique.resourceKey=src/ui/components/RemunerationOptimizer.tsx
# S6772 « espace ambiguë en JSX » : le texte et l'image (bloc) ou la case à cocher (étiquette en flex, avec un écart)
# sont séparés par la mise en page ; une espace ajoutée ne changerait rien à l'affichage.
sonar.issue.ignore.multicriteria.espacesJsxInstallation.ruleKey=typescript:S6772
sonar.issue.ignore.multicriteria.espacesJsxInstallation.resourceKey=src/web/AideALInstallation.tsx
sonar.issue.ignore.multicriteria.espacesJsxComparateur.ruleKey=typescript:S6772
sonar.issue.ignore.multicriteria.espacesJsxComparateur.resourceKey=src/ui/components/ReglagesDuComparateur.tsx

# S1186 « méthode vide » (G10) : le ResizeObserver simulé pour jsdom n'a rien à observer ; ses méthodes sont vides
# exprès.
sonar.issue.ignore.multicriteria.methodesVidesResizeObserver.ruleKey=typescript:S1186
sonar.issue.ignore.multicriteria.methodesVidesResizeObserver.resourceKey=src/ui/testing/setup.ts
# S2699 « test sans assertion » (G10) : expect.poll(…).toEqual(…) est une assertion, que la règle ne reconnaît pas.
sonar.issue.ignore.multicriteria.sansAssertionPoll.ruleKey=typescript:S2699
sonar.issue.ignore.multicriteria.sansAssertionPoll.resourceKey=e2e/preferences.e2e.ts
# Même règle : le cas « sonde » ne fait que noter qu'il s'est exécuté ; le test suivant vérifie qu'il l'a été.
sonar.issue.ignore.multicriteria.sansAssertionSonde.ruleKey=typescript:S2699
sonar.issue.ignore.multicriteria.sansAssertionSonde.resourceKey=src/backend/logic/references/annee-suivante.test.ts
# S8783 « interaction forcée » : les boutons radio des modes du comparateur sont visuellement masqués (sr-only) sous
# une étiquette dessinée ; Playwright ne les juge pas visibles, d'où check({ force: true }).
sonar.issue.ignore.multicriteria.clicForceRadios.ruleKey=typescript:S8783
sonar.issue.ignore.multicriteria.clicForceRadios.resourceKey=e2e-web/**/*.ts

# S1940 « préférer l'opérateur inverse » : !(x > 0) refuse aussi NaN, que x <= 0 laisserait passer ; c'est voulu.
sonar.issue.ignore.multicriteria.negationNaNIR.ruleKey=typescript:S1940
sonar.issue.ignore.multicriteria.negationNaNIR.resourceKey=src/backend/logic/calculsIR.ts
sonar.issue.ignore.multicriteria.negationNaNKm.ruleKey=typescript:S1940
sonar.issue.ignore.multicriteria.negationNaNKm.resourceKey=src/backend/logic/frais-kilometriques.ts
# S7755 « préférer .at(-1) » : le moteur est aussi compilé avec l'interface (tsconfig.app.json, bibliothèque ES2020),
# où Array.prototype.at n'existe pas ; et .at() rendrait T | undefined, à vérifier à chaque appel.
sonar.issue.ignore.multicriteria.atMoteur.ruleKey=typescript:S7755
sonar.issue.ignore.multicriteria.atMoteur.resourceKey=src/backend/logic/**/*.ts
# S6653 « Object.hasOwn » : même raison (ES2022, absent de la bibliothèque ES2020 de l'interface).
sonar.issue.ignore.multicriteria.hasOwnMoteur.ruleKey=typescript:S6653
sonar.issue.ignore.multicriteria.hasOwnMoteur.resourceKey=src/backend/logic/nettoyage-comparateur.ts
# S7758 « codePointAt » : le hachage FNV-1a de l'empreinte d'une session lit des unités UTF-16 ; codePointAt changerait
# l'empreinte des textes avec des émojis, et une proposition en attente ne serait plus reconnue.
sonar.issue.ignore.multicriteria.codePointEmpreinte.ruleKey=typescript:S7758
sonar.issue.ignore.multicriteria.codePointEmpreinte.resourceKey=src/backend/logic/outils/commun.ts
# S9382 « await dans une boucle » : voulu. Le renommage est retenté l'un après l'autre, avec une pause croissante ; les
# propositions sont lues une à une, pour ne pas ouvrir tout un dossier à la fois.
sonar.issue.ignore.multicriteria.awaitDansBoucleRenommage.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.awaitDansBoucleRenommage.resourceKey=src/backend/fichiers-surs.ts
sonar.issue.ignore.multicriteria.awaitDansBoucleBoite.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.awaitDansBoucleBoite.resourceKey=src/backend/boite-aux-propositions.ts
