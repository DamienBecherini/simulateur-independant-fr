# Analyse SonarQube Cloud, lancée par la CI (.github/workflows/ci.yml) quand le secret SONAR_TOKEN existe.
sonar.projectKey=DamienBecherini_simulateur-independant-fr
sonar.organization=damienbecherini
sonar.projectName=Simulateur Indépendant FR

sonar.sources=src
sonar.tests=src,e2e,e2e-web
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,e2e/**/*.ts,e2e-web/**/*.ts
sonar.exclusions=src/components/ui/**
# Le seuil de couverture de la CI ne porte que sur la logique : on aligne SonarQube dessus.
sonar.coverage.exclusions=src/ui/**,src/components/**,src/backend/main.ts,src/backend/preload.cts,src/backend/util.ts,src/backend/pathResolver.ts,src/backend/isDev.ts,src/main.tsx,src/backend/logic/testing/**,src/web/BandeauDemo.tsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
